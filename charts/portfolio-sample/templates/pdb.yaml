apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "portfolio-sample.fullname" . }}
  labels:
    {{- include "portfolio-sample.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "portfolio-sample.selectorLabels" . | nindent 6 }}
