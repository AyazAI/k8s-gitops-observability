replicaCount: 1

image:
  repository: portfolio-sample
  tag: dev
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

strategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: null
  maxUnavailable: 1
