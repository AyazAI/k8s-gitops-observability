# Shared kube-prometheus-stack settings.
# Resource sizes for a local kind node live in values-kind.yaml.
# Grafana does not get a password here. The kind bootstrap creates
# secret grafana-admin-credentials in the monitoring namespace, and
# Grafana reads admin-user / admin-password from that secret.

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    podAntiAffinity: ""

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      uid: prometheus
      name: Prometheus

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    shards: 1
    podAntiAffinity: ""
    retention: 1d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    probeSelector: {}
    scrapeConfigSelector: {}
    ruleNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    probeNamespaceSelector: {}
    scrapeConfigNamespaceSelector: {}
